<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: var(--bgColor);
        }

        section {
            display: flex;
            padding: 40px;
        }

        .login {
            margin: auto;
            width: 25%;
            border: 1px solid var(--primary-color);
            border-radius: 10px;
            padding: 16px 20px;
            position: relative;
            isolation: isolate;
            min-width: 300px;
            font-size: 12px;

            a {
                color: var(--secondary-color);
            }

            .a-hover-style::after {
                content: '';
                position: absolute;
                width: 0%;
                height: 1px;
                background-color: var(--secondary-color);
                bottom: 0;
                left: 50%;
                transform: translateX(-50%);
                transition: .3s;
            }

            .a-hover-style:hover::after {
                width: 100%;
            }



            .login-title {
                text-align: center;

                .title-icon {
                    display: flex;
                    justify-content: center;
                    position: relative;

                    h1 {
                        font-size: 24px;
                        font-weight: 600;
                    }

                    img {
                        width: 1.5em;
                        right: 20%;
                        top: 5%;
                        position: absolute;
                        transform: rotate(20deg);
                    }
                }


                p {
                    padding: 8px;
                }
            }

            .login-form {
                >div:last-child {
                    /* background-color: orange; */
                    display: flex;
                    justify-content: center;
                    align-content: center;
                    gap: 8px;
                    position: relative;

                    a {
                        position: relative;
                    }

                    p,
                    a {
                        padding: 4px;
                    }
                }

                .icon-link {
                    display: flex;
                    gap: 40px;
                    justify-content: center;

                    a {
                        width: 40px;
                        padding: 4px;

                        img {
                            width: 100%;
                        }
                    }

                }

                .or {
                    display: flex;
                    position: relative;
                    align-items: center;
                    justify-content: center;
                    gap: 8px;
                    padding: 4px;

                    p {
                        display: inline-block;
                        color: var(--secondary-txt);
                        padding: 4px 8px;
                        text-align: center;
                    }
                }

                .or::before,
                .or::after {
                    content: '';
                    flex: 1;
                    height: 1px;
                    background-color: var(--secondary-txt);
                }


                form {

                    .submit {
                        width: 100%;

                        input {
                            width: 100%;
                            border: 1px solid var(--neutral-100);
                            border-radius: 5px;
                            padding: 8px;
                            background-color: var(--neutral-100);
                            color: #fff;
                            font-weight: 500;
                            transition: .3s;
                        }

                        input:hover {
                            background-color: var(--secondary-color);
                            border: 1px solid var(--secondary-color);
                            cursor: pointer;
                        }
                    }

                    >div {
                        padding: 8px 4px;

                        label {
                            font-size: 14px;
                            font-weight: 500;
                        }

                        .input-style {
                            display: flex;
                            border: 1px solid #666;
                            border-radius: 4px;
                            padding-inline: 4px;
                            align-items: center;
                            margin-block: 8px;

                            input {
                                border: none;
                                width: 100%;
                                margin-right: 4px;
                                outline: none;

                                letter-spacing: normal;
                                padding-block: 8px;
                            }

                            input::placeholder {
                                font-size: 12px;
                                color: var(--secondary-txt);
                                letter-spacing: 4px;
                            }

                            span {
                                width: 1.5em;

                                img {
                                    width: 100%;
                                }
                            }

                            span:hover {
                                cursor: pointer;
                            }
                        }
                    }

                    .check-style {
                        display: flex;
                        justify-content: space-between;
                        width: 100%;

                        label {
                            display: flex;
                            width: 60%;
                            align-items: center;
                            gap: 8px;
                            color: var(--secondary-txt);
                            font-weight: normal;
                            font-size: 12px;

                            >div {
                                width: 1em;

                                img {
                                    width: 100%;
                                }
                            }

                            input {
                                display: none;
                            }
                        }

                        label:hover {
                            cursor: pointer;
                        }

                        >div {
                            padding-block: 4px;
                            position: relative;
                        }

                    }
                }
            }
        }

        .login::before {
            background-color: #fff;
            z-index: -1;
        }

        .login::after {
            z-index: -2;
            transform: rotate(8deg);
            border: 1px solid var(--primary-color);
        }

        .login::after,
        .login::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <section>
        <div class="login">
            <div class="login-title">
                <div class="title-icon">
                    <h1>歡迎回來</h1>
                    <img src="./images/footprints.svg" alt="">
                </div>
                <p>登入帳號繼續使用服務</p>
            </div>
            <div class="login-form">
                <form action="" autocomplete="off">
                    <div>
                        <label for="">Email</label>
                        <div class="input-style">
                            <input type="email" name="email" placeholder="請輸入帳號" id="user-email">
                        </div>
                    </div>
                    <div>
                        <label for="">Password</label>
                        <div class="input-style">
                            <input type="password" name="psw" placeholder="請輸入密碼" id="user-psw">
                            <span>
                                <img src="images/closepsw.svg" alt="" title="false" id="openpsw">
                            </span>
                        </div>

                    </div>
                    <div class="check-style">
                        <label for="remember">
                            <div>
                                <img src="./images/checkbox-false.svg" alt="" title="false" id="checkbox-img">
                            </div>
                            <input type="checkbox" id="remember">記住我
                        </label>
                        <div class="a-hover-style">
                            <a href="#">忘記密碼?</a>
                        </div>
                    </div>
                    <div class="submit">
                        <input type="submit" value="登入" id="submit">
                    </div>
                </form>
                <div class="or">
                    <p>或</p>
                </div>
                <div class="icon-link">
                    <a href="#">
                        <img src="./images/google.svg" alt="">
                    </a>
                    <a href="#">
                        <img src="./images/facebook.svg" alt="">
                    </a>
                </div>
                <div>
                    <p>
                        還沒有帳號?
                    </p>
                    <a href="#" class="a-hover-style">立即註冊</a>
                </div>
            </div>
        </div>
    </section>

    <script>
        let remember = document.getElementById('remember');
        let checkBox = document.getElementById('checkbox-img');
        let OpenPsw = document.getElementById('openpsw');
        const Submit = document.getElementById('submit');
        let UserEmail = document.getElementById('user-email');
        let UserPsw = document.getElementById('user-psw');

        Submit.addEventListener('click', (e) => {
            e.preventDefault();
            if (UserEmail.value === 'mofli@gmail.com' && UserPsw.value === '111') {
                window.location.href = '/index.html';
                e.preventDefault();
            } else {
                window.alert('輸入錯誤');
            }
        }, false);
        remember.addEventListener('click', () => {
            if (checkBox.title === 'false') {
                checkBox.title = 'true';
                checkBox.src = './images/checkbox-true.svg';
            } else {
                checkBox.title = 'false';
                checkBox.src = './images/checkbox-false.svg'
            }
        }, false);

        OpenPsw.addEventListener('click', () => {
            if (OpenPsw.title === 'false') {
                OpenPsw.title = 'true';
                OpenPsw.src = './images/open.svg';
                UserPsw.type = 'text';
            } else {
                OpenPsw.title = 'false';
                OpenPsw.src = './images/closepsw.svg';
                UserPsw.type = 'password';
            }
        }, false);
    </script>
</body>

</html>
