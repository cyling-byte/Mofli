<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .qa-panel {
            width: 50%;
            overflow-y: auto;
            /* ✅ 超過高度可以滾動 */
            max-height: 500px;
        }

        .qa-block {
            padding: 12px;
            margin-bottom: 16px;
            animation: fadeIn .3s ease;
            /* ✅ 淡入效果 */
        }

        .question {
            font-weight: 500;
            margin-bottom: 8px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option {
            border: 1px solid var(--neutral-100);
            border-radius: 8px;
            padding: 8px 12px;
            text-align: left;
            cursor: pointer;
            transition: .3s;
        }

        .option:hover:not(:disabled) {
            background-color: var(--neutral-200);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="clinic-wrapper">
        <!-- 左邊 -->
        <div class="animal-view">
            <img src="./images/dog.svg" alt="" class="animal-img">
            <button class="hotspot" data-target="eye" style="top: 20%; left: 30%"></button>
            <button class="hotspot" data-target="stomach" style="top: 50%; left: 50%"></button>
            <button class="hotspot" data-target="leg" style="top: 70%; left: 40%"></button>
        </div>

        <!-- 右邊 -->
        <div class="qa-panel">
            <div class="qa-history" id="qa-history">
                <!-- 問答內容動態加進來 -->
            </div>
        </div>
    </div>
    <script>
        const qaData = {
            'eye': {
                question: '眼睛耳朵的症狀是？',
                options: [
                    { text: '眼睛有分泌物', next: 'eye-duration' },
                    { text: '耳朵有異味', next: 'eye-duration' },
                    { text: '一直甩頭', next: 'eye-duration' },
                ]
            },
            'eye-duration': {
                question: '症狀持續多久了？',
                options: [
                    { text: '1天以內', next: 'eye-mild' },
                    { text: '2～3天', next: 'eye-moderate' },
                    { text: '超過一週', next: 'eye-severe' },
                ]
            },
            'eye-mild': {
                question: '建議先觀察，保持眼睛清潔 😊',
                options: []  // 沒有選項代表結束
            },
        }

        // 熱點點擊，開始問答
        document.querySelectorAll('.hotspot').forEach(btn => {
            btn.addEventListener('click', () => {
                // 清空歷史
                document.getElementById('qa-history').innerHTML = '';
                addBlock(btn.dataset.target);
            });
        });

        // 新增問答區塊
        function addBlock(id) {
            const data = qaData[id];
            if (!data) return;

            const history = document.getElementById('qa-history');

            // 建立問題區塊
            const block = document.createElement('div');
            block.classList.add('qa-block');
            block.innerHTML = `
        <p class="question">${data.question}</p>
        <div class="options">
            ${data.options.map(opt => `
                <button class="option" data-next="${opt.next}">${opt.text}</button>
            `).join('')}
        </div>
    `;

            history.appendChild(block);

            // 滾到最新問題
            block.scrollIntoView({ behavior: 'smooth' });
        }

        // 選項點擊
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('option')) {
                // 讓選過的選項變灰，不能再點
                e.target.closest('.options').querySelectorAll('.option').forEach(btn => {
                    btn.disabled = true;
                    btn.style.opacity = '0.5';
                });
                e.target.style.opacity = '1';  // 選到的保持清楚

                addBlock(e.target.dataset.next);
            }
        });
    </script>
</body>

</html>
