        /* .health-btn {

        .health-options {
            position: absolute;
            top: 100%;
            left: 0;
            display: flex;
            gap: 20px;
            padding: 16px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;

            /* 預設隱藏 */
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        /* hover 時顯示 */
        .health-quick-menu:hover .health-options {
            opacity: 1;
            pointer-events: auto;
        }

        .health-category {
            text-align: center;
        }

        .health-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        form input{
            display: block;
        }
    </style>
</head>

    <script>

        let myChart = document.getElementById('myChart');

        const labels = ['January', 'February', 'March', 'April', 'May', 'June', 'July'];
        const data = {
            labels: labels,
            datasets: [{
                label: 'My First Dataset',
                data: [65, 59, 80, 81, 56, 55, 40],
            }]
        };


        let chart = new Chart(myChart, {
            type: 'line', //圖表類型
            data, //設定圖表資料
            options: {
                fill: true,
                borderColor: 'rgb(75, 192, 192)',
                tension: 0.1,
                borderJoinStyle: 'miter'
            } //圖表的一些其他設定，像是hover時外匡加粗
        })
    </script>
